# Compila el APK de "Mis Gastos" en la nube y genera el paquete de entrega.
name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter (estable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Completar la carpeta android
        run: flutter create . --platforms=android --project-name mis_gastos --org com.misgastos

      - name: Descargar dependencias
        run: flutter pub get

      - name: Generar ícono personalizado
        run: dart run flutter_launcher_icons

      - name: Analizar código
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Compilar APK de release
        run: flutter build apk --release

      - name: Armar paquete de entrega (proyecto sin build/ ni .dart_tool/ + APK)
        run: |
          mkdir -p entrega/mis_gastos
          rsync -a ./ entrega/mis_gastos/ \
            --exclude build --exclude .dart_tool --exclude .gradle --exclude .idea \
            --exclude .git --exclude .github --exclude entrega --exclude node_modules
          cp build/app/outputs/flutter-apk/app-release.apk entrega/MisGastos.apk

      - name: Publicar paquete para descargar
        uses: actions/upload-artifact@v4
        with:
          name: MisGastos_entrega
          path: entrega/
